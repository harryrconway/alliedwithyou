# Supabase settings for Allied With You.
# Only what is declared here is pushed to the projects (supabase config push).
# Everything else keeps Supabase's own defaults. The base settings are for production,
# and the [remotes.staging] block adjusts them for the test project.

project_id = "alliedwithyou"

[auth]
site_url = "https://alliedwithyou.com.au/admin/"
additional_redirect_urls = ["https://alliedwithyou.com.au/admin/", "https://alliedwithyou.com.au/admin/index.html"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_expiry = 3600

[auth.email.smtp]
enabled = true
host = "mail.alliedwithyou.com.au"
port = 465
user = "noreply@alliedwithyou.com.au"
pass = "env(SMTP_PASSWORD)"
admin_email = "noreply@alliedwithyou.com.au"
sender_name = "Allied With You"

[auth.email.template.invite]
subject = "You're invited to the Allied With You staff dashboard"
content_path = "./supabase/templates/invite.html"

[auth.email.template.confirmation]
subject = "Confirm your email for the Allied With You staff dashboard"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Allied With You password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/emailchange.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[remotes.staging]
project_id = "nndtedqltzavzxfegdka"

[remotes.staging.auth]
site_url = "http://localhost:8765/admin/"
additional_redirect_urls = ["http://localhost:8765/admin/", "http://localhost:8765/admin/index.html", "http://127.0.0.1:8765/admin/", "http://localhost:*/**", "http://127.0.0.1:*/**"]

# The website's enquiry form calls this without a sign in. It checks every request itself.
[functions.enquiry]
verify_jwt = false
